<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DuelMania</title>
<style>
body { margin: 0; padding: 2em; background: #e5e5e5; color: #444; font: 14px/1.4 Verdana, sans-serif; }
.page { max-width: 1100px; margin: 0 auto; }
h1 { font-weight: normal; color: #222; margin-bottom: 0.2em; }
.subtitle { color: #666; margin: 0; }
.seasons { display: grid; grid-template-columns: repeat(auto-fill, 294px); gap: 2em; margin: 2em 0; }
.season { width: 294px; text-align: center; text-decoration: none; color: #666; }
.season .logo { width: 288px; height: 130px; display: flex; align-items: center; justify-content: center; margin: 0 0 0.5em; background: #000; padding: 2px; border: 1px solid #bbb; border-radius: 4px; }
.season img { max-width: 288px; max-height: 130px; }
.season:hover { color: #000; }
.season:hover .logo { border-color: skyblue; }
.list { margin: 2em 0; }
.list .season { display: block; width: auto; text-align: left; margin: 12px 0; }
.list .name { font-size: 1.3em; font-weight: bold; color: #222; }
.list .season:hover .name { color: skyblue; }
.other { margin: 3em 0; }
.other a { color: #666; }
</style>
</head>
<body>
<div class="page">
<h1>DuelMania</h1>
<p class="subtitle">QuakeWorld multi-region duel tournament (2001-2026)</p>
<div class="seasons">
<a class="season" href="duelmania1/"><div class="logo"><img src="duelmania1/gfx/duelmania.jpg" alt="DuelMania 1"></div><div><b>DuelMania 1:</b> Apr-Jul 2001</div></a>
<a class="season" href="duelmania2/"><div class="logo"><img src="duelmania2/gfx/duelmania.jpg" alt="DuelMania 2"></div><div><b>DuelMania 2:</b> Jun-Jul 2002</div></a>
</div>
<p class="other">DuelMania Reloaded and later (2006-2026): <a href="https://www.duelmania.net/">duelmania.net</a></p>
</div>
</body>
</html>
