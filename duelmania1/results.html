<img id="shot-preview" alt="" style="position: absolute; display: none; pointer-events: none; border: 1px solid #000">
<script>
var preview = document.getElementById("shot-preview");
var imageTarget = /\/screenshots\/|\.(gif|jpe?g|png|webp)$/i;
document.querySelectorAll("map area[href]").forEach(function (area) {
  if (!imageTarget.test(area.getAttribute("href"))) return;
  area.addEventListener("mouseenter", function () { preview.src = area.href; preview.style.display = "block"; });
  area.addEventListener("mouseleave", function () { preview.style.display = "none"; });
  area.addEventListener("mousemove", function (event) {
    var left = event.pageX + 16;
    if (left + preview.offsetWidth > window.scrollX + window.innerWidth) left = event.pageX - 16 - preview.offsetWidth;
    var bottom = window.scrollY + window.innerHeight;
    preview.style.left = left + "px";
    preview.style.top = Math.max(window.scrollY, Math.min(event.pageY + 16, bottom - preview.offsetHeight)) + "px";
  });
});
</script>
